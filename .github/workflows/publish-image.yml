name: Publish Studio Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/nyptid/nyptid-studio-api:latest
  RENDER_API_BASE: https://api.render.com/v1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE_URL: ${{ env.IMAGE_NAME }}
        run: |
          set -eu
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "Render deploy skipped: missing RENDER_API_KEY or RENDER_SERVICE_ID secret."
            exit 0
          fi

          payload=$(printf '{"imageUrl":"%s"}' "$IMAGE_URL")
          response_file="$(mktemp)"
          http_code="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "${RENDER_API_BASE}/services/${RENDER_SERVICE_ID}/deploys")"

          cat "$response_file"
          echo

          if [ "$http_code" != "201" ] && [ "$http_code" != "202" ]; then
            echo "Render deploy failed with HTTP ${http_code}."
            exit 1
          fi
