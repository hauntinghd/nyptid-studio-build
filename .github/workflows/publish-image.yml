name: Publish Studio Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/hauntinghd/nyptid-studio-api
  SOURCE_REPO: git@github.com:hauntinghd/studionyptixd.git
  SOURCE_BRANCH: codex/render-studio-backend

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%s\n' '${{ secrets.SOURCE_REPO_DEPLOY_KEY }}' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"

      - name: Clone private source repo
        shell: bash
        run: |
          set -eu
          rm -rf app
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            git clone --branch "$SOURCE_BRANCH" --depth 1 "$SOURCE_REPO" app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=NYPTID Studio API
            org.opencontainers.image.description=Deployable API image for NYPTID Studio
            org.opencontainers.image.source=https://github.com/hauntinghd/nyptid-studio-build

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
